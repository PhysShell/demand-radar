# Phase 2B "GitHub Actions Acquisition Bridge" -- runs
# scripts/acquire_github_issues.py on a GitHub-hosted runner (real network
# egress, real GITHUB_TOKEN) because this repo's own development session
# has neither: no general network egress, and no way to add cross-owner
# GitHub repositories to search across. See
# docs/trials/historical-corpus-replay.md for why that path was exhausted,
# and research/acquisition-request.yaml's own header comment for why the
# trigger below is push-on-path, not workflow_dispatch: the agent that
# authored this bridge cannot invoke workflow_dispatch either, so acceptance
# of this bridge must not depend on it. workflow_dispatch is wired below
# only as a convenience for a human maintainer.
name: acquire-github-issues

"on":
  push:
    paths:
      - "research/acquisition-request.yaml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: acquire-github-issues-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    name: acquire GitHub issues (own-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install demand-radar (pulls pydantic/pyyaml/jsonschema from pyproject.toml,
          so this script validates against the real RawEvidenceRecord model, not a copy)
        run: python3 -m pip install --disable-pip-version-check --quiet -e .

      - name: Run acquisition (real GitHub Search API call, real GITHUB_TOKEN)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/acquire_github_issues.py

      - name: Push data/ to a fresh orphan research-data branch
        # Deliberately NOT actions/upload-artifact: this agent's own session
        # cannot retrieve an Actions artifact (the download URL resolves to
        # Azure Blob Storage, outside its network egress allowlist --
        # confirmed by a real, blocked attempt during Phase 2A). An ordinary
        # branch it can `git fetch` directly has no such problem.
        env:
          GIT_AUTHOR_NAME: demand-radar-acquisition-bridge
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: demand-radar-acquisition-bridge
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          set -euo pipefail

          BRANCH="research-data/own-audit-live-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"

          git checkout --orphan "$BRANCH"
          # Un-stage everything inherited from the source branch's index --
          # data/ was never tracked there (gitignored), so it is untouched.
          git rm -r -f --cached . >/dev/null
          # Physically remove everything except data/ (and .git) from the
          # working tree, so the orphan branch's first commit contains
          # exactly data/evidence.jsonl, data/manifest.json,
          # data/acquisition-summary.md and nothing from the main codebase.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'data' -exec rm -rf {} +

          git add data/
          git commit -m "research-data: own-audit live GitHub issues acquisition, run ${GITHUB_RUN_ID}"
          git push -u origin "$BRANCH"

          echo "DATA_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          {
            echo "## Data branch"
            echo ""
            echo "\`$BRANCH\`"
            echo ""
            cat data/acquisition-summary.md
          } >> "$GITHUB_STEP_SUMMARY"
