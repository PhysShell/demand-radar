# Phase 2C1 "Stack Overflow Acquisition Bridge" -- runs
# scripts/acquire_stackoverflow_questions.py on a GitHub-hosted runner (real
# network egress) because this repo's own development session has none --
# same premise as .github/workflows/acquire-github-issues.yml (Phase 2B),
# and the same reason the trigger below is push-on-path, not
# workflow_dispatch: the agent that authored this bridge cannot invoke
# workflow_dispatch either, so acceptance must not depend on it.
# workflow_dispatch is wired below only as a convenience for a human
# maintainer.
name: acquire-stackoverflow-questions

"on":
  push:
    paths:
      - "research/stackoverflow-acquisition-request.yaml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: acquire-stackoverflow-questions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    name: acquire Stack Overflow questions (own-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install demand-radar (pulls pydantic/pyyaml/jsonschema from pyproject.toml,
          so this script validates against the real RawEvidenceRecord model, not a copy)
        run: python3 -m pip install --disable-pip-version-check --quiet -e .

      - name: Run acquisition (real Stack Exchange API v2.3 call; STACKEXCHANGE_KEY
          is optional -- an unset/empty secret is treated as "no key", not a failure)
        env:
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          REQUEST_COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/acquire_stackoverflow_questions.py

      - name: Push data/ to a fresh orphan research-data branch
        # Deliberately NOT actions/upload-artifact -- same reason as Phase
        # 2B: this agent's own session cannot retrieve an Actions artifact
        # (Azure Blob Storage redirect, outside its egress allowlist). An
        # ordinary branch it can `git fetch` directly has no such problem.
        env:
          GIT_AUTHOR_NAME: demand-radar-acquisition-bridge
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: demand-radar-acquisition-bridge
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          set -euo pipefail

          BRANCH="research-data/own-audit-stackoverflow-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"

          git checkout --orphan "$BRANCH"
          # Un-stage everything inherited from the source branch's index --
          # data/ was never tracked there (gitignored), so it is untouched.
          git rm -r -f --cached . >/dev/null
          # Physically remove everything except data/ (and .git) from the
          # working tree, so the orphan branch's first commit contains
          # exactly the five data/ files and nothing from the main codebase.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'data' -exec rm -rf {} +

          git add data/
          git commit -m "research-data: own-audit live Stack Overflow acquisition, run ${GITHUB_RUN_ID}"
          git push -u origin "$BRANCH"

          echo "DATA_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          {
            echo "## Data branch"
            echo ""
            echo "\`$BRANCH\`"
            echo ""
            cat data/acquisition-summary.md
          } >> "$GITHUB_STEP_SUMMARY"
